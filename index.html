<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Finance Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
  <main class="container mt-4">
    <h1 class="mb-3">Add Income</h1>
    <form id="incomeForm">
      <div class="mb-3">
        <label for="ISN" class="form-label">Income Source Name:</label>
        <input type="text" class="form-control" id="ISN" name="ISN" required minlength="3">
      </div>

      <div class="mb-3">
        <label for="Amount" class="form-label">Amount:</label>
        <input type="text" class="form-control" id="Amount" name="Amount" required>
      </div>

      <div class="mb-3">
        <label for="Frequency" class="form-label">Frequency:</label>
        <select class="form-select" id="Frequency" name="Frequency" required>
          <option value="">Select</option>
          <option value="one-time">One-time</option>
          <option value="monthly">Monthly</option>
          <option value="bi-weekly">Bi-weekly</option>
          <option value="yearly">Yearly</option>
        </select>
      </div>

      <button type="submit" class="btn btn-primary">Submit</button>
    </form>
  </main>

  <script>
    document.getElementById('Amount').addEventListener('blur', function () {
      let amountValue = parseFloat(this.value);
      if (!isNaN(amountValue) && amountValue > 0) {
        this.value = amountValue.toFixed(2);
      } else {
        this.value = '';
        alert('Please enter a valid amount greater than 0');
      }
    });

    document.getElementById('incomeForm').addEventListener('submit', function (event) {
      event.preventDefault();
      requestMenu();
    });


    function requestMenu() {
      const API_URL = "https://webhook-test.com/dc8ff6e46152f168eade4720ad57f712";
      let data = new FormData(document.getElementById("incomeForm"));

      fetch(API_URL, {
        method: "POST",
        body: data
      })
        .then(statusCheck)
        .then(resp => resp.text()) 
        .then(handleResponse)
        .catch(handleError);
    }


    function statusCheck(response) {
      if (!response.ok) {
        throw new Error(`HTTP error! Status: ${response.status}`);
      }
      return response;
    }

    function handleResponse(data) {
      alert("Income data submitted successfully!");
      console.log("Response:", data);
    }

    function handleError(error) {
      alert("An error occurred while submitting the form.");
      console.error("Error:", error);
    }
  </script>
</body>
</html>
